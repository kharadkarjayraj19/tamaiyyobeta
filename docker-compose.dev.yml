services:
  postgres:
    image: postgres:16-alpine
    container_name: tamaiyyo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: tamaiyyo_dev
      POSTGRES_USER: tamaiyyo
      POSTGRES_PASSWORD: tamaiyyo
    ports:
      - "5432:5432"
    volumes:
      - tamaiyyo_postgres_data:/var/lib/postgresql/data

volumes:
  tamaiyyo_postgres_data:
