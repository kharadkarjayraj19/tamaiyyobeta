services:
  postgres:
    image: postgres:16-alpine
    container_name: tamayo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: tamayo_dev
      POSTGRES_USER: tamayo
      POSTGRES_PASSWORD: tamayo
    ports:
      - "5432:5432"
    volumes:
      - tamayo_postgres_data:/var/lib/postgresql/data

volumes:
  tamayo_postgres_data:
